input {
  kb_layout = us,th
  kb_options = grp:caps_toggle
  repeat_rate = 40
  repeat_delay = 400
  numlock_by_default = true
  accel_profile = flat
  sensitivity = 0.0
  follow_mouse = 1
}

misc {
    key_press_enables_dpms = true  # key press will trigger wake
    mouse_move_enables_dpms = false # mouse move will trigger wake
}

windowrule = match:class (Alacritty|kitty|foot), scroll_touchpad 1.5
windowrule = match:class com.mitchellh.ghostty, scroll_touchpad 0.8
